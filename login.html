    <script>
        //#region
        var xw_lan = ["PLMPLUS", "请输入账号", "请输入密码", "登录"];
        var xw_lan_new = [];
        $(document).ready(function () {
            console.log(APIS)
        });

        //#region 获取语言表
        function get_lang_list() {
            var JsonPara = { list_id: [8] };
            var apiurl = "api/lan_csh/get_list";
            var re_obj = tf_ajax_wtk(JsonPara, apiurl);
            if (re_obj.flag == 1) {
                var lang_list = re_obj.data;
                sessionStorage.setItem('language_list', JSON.stringify(lang_list));
                return lang_list;
            }
        }
        //#endregion

        //#region 获取默认语言
        function get_moren_lang() {
            var JsonPara = { list_id: [7] };
            var apiurl = "api/lan_csh/get_lan_sel";
            var re_obj = tf_ajax_wtk(JsonPara, apiurl);
            if (re_obj.flag == 1) {
                var moren_lang_json = re_obj.data;
                return moren_lang_json;
            }
        }
        //#endregion

        //#region 判空
        function isUndefine(item) {
            // if(item == 0) { return false; }
            if (item == undefined || item == null || item == "undefined" || item == "null" || item == "") {
                return true;
            }
            return false;
        }
        //#endregion

        //#region
        layui.use(['form'], function () {
            var form = layui.form,
                layer = layui.layer;
            form.on('submit(login)', function (data) {
                data = data.field;
                if (data.username == '' || data.password == '') {
                    layer.msg('用户名和密码不能为空');
                    return false;
                }
                var JsonPara = { username: data.username, password: data.password, type: "pc" };
                var apiurl = APIS.login;
                try {
                    var re_obj = login_lay(JsonPara, apiurl);
                    if (re_obj.flag == 1) {
                        sessionStorage.setItem("userInfo", re_obj.data);
                        $.cookie("token", re_obj.data, { expires: expiresDate, path: '/' });
                        location.href = "./index.html";
                    }
                    else if (re_obj.flag == 0) {
                        $("#msg").html("用户名或密码错误"); return;
                    }
                    else if (re_obj.flag == 2) {
                        alert(re_obj.msg);
                    }
                }
                catch {
                    layer.alert("登录失败");
                    return false;
                }

                // layer.msg('登录成功', function () {
                //     window.location = '/index.html';
                // });
                return false;
            });
        });
        //#endregion

        function login_lay(JsonPara, apiurl) {
            var re_obj = { flag: 0, msg: "请求失败" };
            $.ajax({
                type: "post",
                url: APIS.api_yuming + apiurl,
                data: JSON.stringify(JsonPara),
                dataType: "json",
                traditional: true,
                async: false,
                contentType: "application/json; charset=utf-8",
                success: function (data) {

                    if (data.flag == 1) {
                        $.cookie("token", data.data, { expires: expiresDate, path: '/' });
                        re_obj.flag = 1;
                        re_obj.msg = "登录成功！";
                    } else {
                        re_obj.flag = 0;
                        re_obj.msg = "用户名或密码错误！";
                    }

                },
                error: function (data) {
                    re_obj.flag = 2;
                    re_obj.msg = "网络或服务器内部错误";
                }
            });
            return re_obj;
        }

    </script>
