<body style="height:100%">

    <div class="main">

        <div class="content clearfix">
            <div class="top_box bbt_none">
                <div class="top_box_title" data-word="用户管理">
                    用户管理
                </div>
                <div class="top_box_btn_group jexcel_custom_element">
                    <div class="top_box_btn_item display_none add_auto" data-perm="user.manager.add"

                        <span class="my-icon layui-icon layui-icon-addition"></span>

                    </div>

                    </div>

                    </div>
                </div>
                <div class="top_box_btn_group mgl_auto jexcel_custom_element">

                </div>
